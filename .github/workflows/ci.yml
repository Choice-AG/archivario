name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Presupuesto de JavaScript inicial por página.
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      # Sin variables de Firebase: la app arranca en modo demostración.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Auth y Firestore emulados con un proyecto demo-*: sin credenciales reales.
      - run: npm run test:e2e:emulators
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-emulators-report
          path: |
            playwright-report
            test-results
          retention-days: 7
