# Actualizaciones automáticas: una PR por grupo, revisadas por la CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Parches y versiones menores juntos para no llenar la lista de PRs.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Todas las actions en una sola PR al mes.
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
